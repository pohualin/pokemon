---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {%- if page.url contains "/by-" -%}
      {{ content | replace: '<img src="https://tcgplayer-cdn.tcgplayer.com', '<img loading="lazy" decoding="async" src="https://tcgplayer-cdn.tcgplayer.com' }}
    {%- else -%}
      {{ content }}
    {%- endif -%}
  </div>

</article>
